<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --bg-main: #070b14;
            --bg-card: #0d1626;
            --bg-hover: #14243a;
            --accent: #00e5ff;
            --accent-secondary: #8b5cf6;
            --text-primary: #e6f1ff;
            --text-secondary: #91a4bd;
            --border: #1d3048;
        }

        /* Main background */
        body.nexquest-theme {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
        }

        /* Page heading */
        h2 {
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        hr {
            border-color: var(--border);
            opacity: 1;
        }

        /* Project cards */
        .card {
            background: linear-gradient(
                145deg,
                #0d1626,
                #090f1b
            );
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: translateY(-4px);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.08);
        }

        .card-title {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn-primary {
            background-color: #075985;
            color: #e6faff;
            border: 1px solid var(--accent);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0e7490;
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.2);
        }

        /* Add project button */
        .add-project-btn {
            margin: 0 0 30px 12px;
            padding: 10px 18px;
        }

        /* Empty projects message */
        .empty-message {
            color: var(--text-secondary);
        }
    </style>
</head>

<body class="nexquest-theme">

    <div class="container mt-5">

        <h2>My Projects</h2>
        <hr>

        <div class="row">

            {% for project in projects %}
            <div class="col-md-4 mb-3">

                <div class="card h-100">
                    <div class="card-body">

                        <h5 class="card-title">
                            {{ project.name }}
                        </h5>

                        <a href="{{ project.link }}"
                           class="btn btn-primary">
                            Open Project
                        </a>

                    </div>
                </div>

            </div>
            {% else %}
            <p class="empty-message">No projects available.</p>
            {% endfor %}

        </div>

    </div>

   
    <button type="button"
            class="btn btn-primary"
            onclick="document.getElementById('projectForm').style.display = 'block'">
        + Add New Project
    </button>
    <div id="projectForm" style="display: none;" class="mt-4">

    <div class="card p-4" style="max-width: 500px;">

        <h4 class="mb-3" style="color: #00e5ff;">
            Create New Project
        </h4>

        <form action="{{ url_for('projects') }}" method="POST">

            <div class="mb-3">
                <label for="projectName" class="form-label">
                    Project Name
                </label>

                <input type="text"
                       id="projectName"
                       name="name"
                       class="form-control bg-dark text-light border-secondary"
                       placeholder="Enter project name"
                       required>
            </div>

            <div class="mb-3">
                <label for="projectDescription" class="form-label">
                    Description
                </label>

                <textarea id="projectDescription"
                          name="description"
                          class="form-control bg-dark text-light border-secondary"
                          rows="3"
                          placeholder="Enter project description"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label for="projectLink" class="form-label">
                    Project Link (optional)
                </label>

                <input type="url"
                       id="projectLink"
                       name="link"
                       class="form-control bg-dark text-light border-secondary"
                       placeholder="https://example.com">
            </div>

            <button type="submit" class="btn btn-primary">
                Save Project
            </button>

            <button type="button"
                    class="btn btn-outline-secondary ms-2"
                    onclick="document.getElementById('projectForm').style.display = 'none'">
                Cancel
            </button>

        </form>

    </div>
</div>

</body>
</html>
