<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --bg-main: #070b14;
            --bg-card: #0d1626;
            --bg-hover: #14243a;
            --accent: #00e5ff;
            --accent-secondary: #8b5cf6;
            --text-primary: #e6f1ff;
            --text-secondary: #91a4bd;
            --border: #1d3048;
        }

        body.nexquest-theme {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
        }

        h2 {
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        hr {
            border-color: var(--border);
            opacity: 1;
        }

        .card {
            background: linear-gradient(
                145deg,
                #0d1626,
                #090f1b
            );
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: translateY(-4px);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.08);
        }

        .card-title {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #075985;
            color: #e6faff;
            border: 1px solid var(--accent);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0e7490;
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.2);
        }

        .add-project-btn {
            margin: 0 0 30px 12px;
            padding: 10px 18px;
        }

        .empty-message {
            color: var(--text-secondary);
        }
    </style>
    <style>
     :root {
      --bg-main: #070b14;
      --bg-navbar: #0b1220;
      --bg-card: #0d1626;
      --bg-hover: #14243a;

      --accent: #00e5ff;
      --accent-secondary: #8b5cf6;

      --text-primary: #e6f1ff;
      --text-secondary: #91a4bd;

      --border: #1d3048;
      --danger: #ff5370;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      margin: 0;
      font-family: "Segoe UI", sans-serif;
    }
    .navbar {
      background-color: var(--bg-navbar) !important;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.04);
      padding: 14px 20px;
    }
    .navbar-brand {
      color: var(--accent) !important;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    .navbar .nav-link {
      color: var(--text-secondary) !important;
      border-radius: 6px;
      padding: 9px 12px;
      transition: all 0.2s ease;
    }
    .navbar .nav-link:hover {
      color: var(--accent) !important;
      background-color: var(--bg-hover);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .navbar .nav-link.active {
      color: var(--accent) !important;
    }
    .navbar-toggler {
      border-color: var(--border);
    }
    .navbar-toggler-icon {
      filter: invert(1);
    } 
    .navbar .btn-outline-danger {
      color: var(--danger);
      border-color: #713044;
    }
    .navbar .btn-outline-danger:hover {
      background-color: #4a1828;
      color: #fff;
      border-color: var(--danger);
    }
    .card {
      background: linear-gradient(
        145deg,
        #0d1626,
        #090f1b
      ) !important;

      color: var(--text-primary) !important;
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      transition: border-color 0.25s ease,
                  transform 0.25s ease,
                  box-shadow 0.25s ease;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.08);
      transform: translateY(-3px);
    }
    .card-title {
      color: var(--accent);
      font-weight: 700;
    }
    .card-text {
      color: var(--text-secondary);
    }
    .btn-primary {
      background-color: #075985;
      border-color: var(--accent);
      color: #e6faff;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background-color: #0e7490;
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.2);
    }
    .bg-info,
    .bg-body-tertiary {
      background-color: var(--bg-navbar) !important;
    }
    .navbar-collapse {
      background-color: var(--bg-navbar);
    }
    .card canvas {
      padding: 10px;
    }

    </style>
</head>

<body class="nexquest-theme">

    <div><nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">NexQuest</a>
     <a class="navbar-brand fw-bold fs-4" aria-current="page" aria-current="page" >Welcome, {{session.get('name')}}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
        <a href="/dashboard" class="nav-link ">Dashboard</a></li>
        <li><a href="/goals" class="nav-link ">Goals</a></li>
        <li><a href="/projects" class="nav-link active ">Completed Goals</a></li>
        <li><a href="#" class="nav-link ">Tasks</a></li>
        <li><a href="/profile" class="nav-link ">Profile</a></li>

          <li class="nav-item ">
            <a href="/logout" class="nev-link  btn btn-outline-danger mt-3" >Logout</a>
          </li>
        </li>
      </ul>
    </div>
  </div>
</nav>
</div>

    <div class="container mt-5">

        <h2>My Projects</h2>
        <hr>

        <div class="row">

            {% for project in projects %}
            <div class="col-md-4 mb-3">

                <div class="card h-100">
                    <div class="card-body">

                        <h5 class="card-title">
                            {{ project.name }}
                        </h5>

                        <a href="{{ project.link }}"
                           class="btn btn-primary">
                            Open Project
                        </a>

                    </div>
                </div>

            </div>
            {% else %}
            <p class="empty-message">No projects available.</p>
            {% endfor %}

        </div>

    </div>

   
    <button type="button"
            class="btn btn-primary"
            onclick="document.getElementById('projectForm').style.display = 'block'">
        + Add New Project
    </button>
    <div id="projectForm" style="display: none;" class="mt-4">

    <div class="card p-4" style="max-width: 500px;">

        <h4 class="mb-3" style="color: #00e5ff;">
            Create New Project
        </h4>

        <form action="{{ url_for('projects') }}" method="POST">

            <div class="mb-3">
                <label for="projectName" class="form-label">
                    Project Name
                </label>

                <input type="text"
                       id="projectName"
                       name="name"
                       class="form-control bg-dark text-light border-secondary"
                       placeholder="Enter project name"
                       required>
            </div>

            <div class="mb-3">
                <label for="projectDescription" class="form-label">
                    Description
                </label>

                <textarea id="projectDescription"
                          name="description"
                          class="form-control bg-dark text-light border-secondary"
                          rows="3"
                          placeholder="Enter project description"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label for="projectLink" class="form-label">
                    Project Link
                </label>

                <input type="url"
                       id="projectLink"
                       name="link"
                       class="form-control bg-dark text-light border-secondary"
                       placeholder="https://example.com">
            </div>

            <button type="submit" class="btn btn-primary">
                Save Project
            </button>

            <button type="button"
                    class="btn btn-outline-secondary ms-2"
                    onclick="document.getElementById('projectForm').style.display = 'none'">
                Cancel
            </button>

        </form>

    </div>
</div>

</body>
</html>
