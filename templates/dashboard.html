<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  <style>
     :root {
      --bg-main: #070b14;
      --bg-navbar: #0b1220;
      --bg-card: #0d1626;
      --bg-hover: #14243a;

      --accent: #00e5ff;
      --accent-secondary: #8b5cf6;

      --text-primary: #e6f1ff;
      --text-secondary: #91a4bd;

      --border: #1d3048;
      --danger: #ff5370;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      margin: 0;
      font-family: "Segoe UI", sans-serif;
    }

    .navbar {
      background-color: var(--bg-navbar) !important;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.04);
      padding: 14px 20px;
    }

    .navbar-brand {
      color: var(--accent) !important;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .navbar .nav-link {
      color: var(--text-secondary) !important;
      border-radius: 6px;
      padding: 9px 12px;
      transition: all 0.2s ease;
    }

    .navbar .nav-link:hover {
      color: var(--accent) !important;
      background-color: var(--bg-hover);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .navbar .nav-link.active {
      color: var(--accent) !important;
    }

    .navbar-toggler {
      border-color: var(--border);
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    /* Logout */
    .navbar .btn-outline-danger {
      color: var(--danger);
      border-color: #713044;
    }

    .navbar .btn-outline-danger:hover {
      background-color: #4a1828;
      color: #fff;
      border-color: var(--danger);
    }

    .card {
      background: linear-gradient(
        145deg,
        #0d1626,
        #090f1b
      ) !important;

      color: var(--text-primary) !important;
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      transition: border-color 0.25s ease,
                  transform 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.08);
      transform: translateY(-3px);
    }

    .card-title {
      color: var(--accent);
      font-weight: 700;
    }

    .card-text {
      color: var(--text-secondary);
    }

    .btn-primary {
      background-color: #075985;
      border-color: var(--accent);
      color: #e6faff;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #0e7490;
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.2);
    }

    .bg-info,
    .bg-body-tertiary {
      background-color: var(--bg-navbar) !important;
    }

    .navbar-collapse {
      background-color: var(--bg-navbar);
    }

    .card canvas {
      padding: 10px;
    }

  </style>

</head>
<body >

  <div><nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">NexQuest</a>
     <a class="navbar-brand fw-bold fs-4" aria-current="page" aria-current="page" >Welcome, {{user.name}}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
        <a href="/dashboard" class="nav-link ">Dashboard</a></li>
        <li><a href="#" class="nav-link ">Goals</a></li>
        <li><a href="/projects" class="nav-link  ">Completed Goals</a></li>
        <li><a href="#" class="nav-link ">Tasks</a></li>
        <li><a href="/profile" class="nav-link ">Profile</a></li>

          <li class="nav-item ">
            <a href="/logout" class="nev-link  btn btn-outline-danger mt-3" >Logout</a>
          </li>
        </li>
      </ul>
    </div>
  </div>
</nav>
</div>


   
    <div>
      <section class="card m-5 bg-info" style="max-width: 320px">
      <canvas id="myChart2"></canvas>
        <div class="card-body">
          <h4 class="card-title">Progress</h4>
          <p class="card-text">Complition of each task track your progress</p>
        </div>
      </section>

      </div>

      </div>
      <script>
        const ctx2 = document.getElementById('myChart2');
        const sal1 =  document.getElementById('age');
        new Chart(ctx2, {
          type: 'polarArea',
          data: {
            labels: [
              {% for goals in userdata["goals"] %}
                {{ goals["name"] | tojson }}{% if not loop.last %},{% endif %}
              {% endfor %}
            ],
            data  sets: [{
              label: 'Goal Progress (%)',
              data: [
                {% for goals in userdata["goals"] %}
                  {{ goals["progress"] }}{% if not loop.last %},{% endif %}
                {% endfor %}
              ],
              borderWidth: 1,
              backgroundColor: ['red','orange', 'white'],
            borderColor: ['white','pink', 'green'],
            }]
          }
        });
      </script>


          



</body>
</html>
