    <div class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white">

    <div>
      <input id="age" type="text" value={{user.age}} style="display: none;">
      <section class="card m-5 bg-info" style="max-width: 320px">
      <canvas id="myChart2"></canvas>
        <div class="card-body">
          <h4 class="card-title">Graph</h4>
          <p class="card-text">Pie Chart</p>
          <a href="#" class="btn btn-primary theme-primary">Go somewhere</a>
        </div>
      </section>

      </div>

      </div>
      <script>
        const ctx2 = document.getElementById('myChart2');
        const sal1 =  document.getElementById('age');
        new Chart(ctx2, {
          type: 'polarArea',
          data: {
        
            labels: [
              {% for goal in userdata["goals"] %}
                {{ goal["name"] | tojson }}{% if not loop.last %},{% endif %}
              {% endfor %}
            ],
            datasets: [{
              label: 'Goal Progress (%)',
              data: [
                {% for goal in userdata["goals"] %}
                  {{ goal["progress"] }}{% if not loop.last %},{% endif %}
                {% endfor %}
              ],
              borderWidth: 1,
              backgroundColor: ['red','orange', 'black'],
            borderColor: ['white','pink', 'green'],
            }]
          }
        });
      </script>
