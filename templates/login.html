<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f0fdfa);
            color: #1e293b;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px #00000015;
        }

        h1 {
            margin: 0 0 10px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #64748b;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }

        input:focus {
            outline: 2px solid #4f46e5;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #4f46e5;
            outline-offset: 4px;
        }

        .error {
            padding: 12px;
            background: #fef2f2;
            color: #b91c1c;
            border-radius: 8px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #4f46e5;
        }
    </style>
</head>

<body>
    <main class="login-box">
        <h1>Welcome back!</h1>
        <p class="subtitle">Log in to open your dashboard.</p>

         {% if error %}
            <p class="error" role="alert">{{ error }}</p>
         {% endif %} 

        <form method="POST">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
            <p>Don't have any account?</p>
            <a href ="{{url_for('signup')}}">Create New Account</a>

            <button type="submit">Log In</button>
        </form>

        <a href="{{ url_for('home') }}" class="back">Back to Home</a>
    </main>
</body>
</html>
